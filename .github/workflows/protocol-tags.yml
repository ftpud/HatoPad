name: Protocol tags
on:
  push:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: protocol-tags-${{ github.ref }}
  cancel-in-progress: false
jobs:
  protocol-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PROTOCOL_CHANNEL: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Skip superseded commits
        id: tip
        run: |
          git fetch --no-tags origin "$PROTOCOL_CHANNEL"
          if [ "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else echo "A newer commit exists; it will be tagged instead."; fi
      - if: steps.tip.outputs.current == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          cache: npm
      - if: steps.tip.outputs.current == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: steps.tip.outputs.current == 'true'
        name: Verify declared protocol metadata and that this commit builds
        run: |
          node scripts/sync-protocol.mjs --check
          npm run build
          npm run typecheck
      - if: steps.tip.outputs.current == 'true'
        run: npm run test -w @hatopad/protocol
      - if: steps.tip.outputs.current == 'true'
        run: node --test scripts/protocol-tags.test.mjs
      - if: steps.tip.outputs.current == 'true'
        name: Create immutable tags, publish them, then remove superseded ones
        run: |
          # Push only this run's tags; stale local tags must not be republished.
          node scripts/protocol-tags.mjs > current-tags.txt
          while read -r tag; do
            git push origin "refs/tags/$tag"
          done < current-tags.txt
          node scripts/protocol-tags.mjs --obsolete | while read -r tag; do
            [ -n "$tag" ] && git push origin --delete "refs/tags/$tag"
          done
